[project]
name = "assistente-criador-conteudo"
version = "0.1.0"
description = "Assistente RAG para criadores de conteudo (publicidade, saude, direitos autorais, LGPD)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=1.40",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=4.0",
    "langchain-text-splitters>=0.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
obs = ["langfuse>=2.0"]
eval = [
    "ragas==0.4.3",
    "datasets>=2.0",
    "langchain-openai>=0.1",
    "langchain-huggingface>=0.1",
    "langchain-community<0.4.2",
]

[tool.poetry]
package-mode = false

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py310"